<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <script>
    (function () {
        const theme = localStorage.getItem('theme');

        if (theme === 'dark') {
            document.documentElement.classList.add('dark-mode');
        }
    })();
        </script>

    <title>Catalogue - BiblioSpace</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>


<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="site-header">

        <a
            href="/"
            class="logo"
        >
            📚 BiblioSpace
        </a>


        <nav>

            <a
                href="/books.html"
                class="active"
            >
                Livres
            </a>

            <a href="/dashboard.html" id="spaceLink">
                Mon espace
            </a>

            <a href="/login.html">
                Connexion
            </a>

            

        </nav>

    </header>



    <!-- =====================================================
         CONTENU PRINCIPAL
    ====================================================== -->

    <main class="page">


        <!-- =================================================
             EN-TÊTE
        ================================================== -->

        <div class="page-head">

            <div class="catalog-title">

                <span class="eyebrow">
                    Catalogue
                </span>

                <h1>
                    Nos livres
                </h1>

                <p class="muted">
                    Découvrez les livres disponibles
                    dans notre bibliothèque.
                </p>

            </div>



            <!-- =================================================
                 FILTRES
            ================================================== -->

            <div class="filters">


                <!-- Recherche -->

                <div class="filter-group">

                    <label
                        for="search"
                        class="filter-label"
                    >
                        Rechercher
                    </label>

                    <input
                        type="search"
                        id="search"
                        placeholder="Titre, auteur, ISBN..."
                        autocomplete="off"
                    >

                </div>



                <!-- Catégorie -->

                <div class="filter-group">

                    <label
                        for="category"
                        class="filter-label"
                    >
                        Catégorie
                    </label>

                    <select id="category">

                        <option value="">
                            Toutes les catégories
                        </option>

                    </select>

                </div>



                <!-- Disponibilité -->

                <div class="filter-group">

                    <label
                        for="available"
                        class="filter-label"
                    >
                        Disponibilité
                    </label>

                    <select id="available">

                        <option value="">
                            Tous les livres
                        </option>

                        <option value="true">
                            Disponible
                        </option>

                        
                    </select>

                </div>

            </div>

        </div>



        <!-- =================================================
             STATISTIQUES
        ================================================== -->

        <section
            class="catalog-stats"
            aria-label="Statistiques du catalogue"
        >


            <!-- Total -->

            <div class="stat-card">

                <div class="stat-icon">
                    📚
                </div>

                <div class="stat-content">

                    <span class="stat-label">
                        Total des livres
                    </span>

                    <strong id="totalBooks">
                        0
                    </strong>

                </div>

            </div>



            <!-- Disponibles -->

            <div class="stat-card">

                <div class="stat-icon">
                    ✅
                </div>

                <div class="stat-content">

                    <span class="stat-label">
                        Disponibles
                    </span>

                    <strong id="availableBooks">
                        0
                    </strong>

                </div>

            </div>



            <!-- Résultats -->

            <div class="stat-card">

                <div class="stat-icon">
                    🔎
                </div>

                <div class="stat-content">

                    <span class="stat-label">
                        Résultats
                    </span>

                    <strong id="resultCount">
                        0
                    </strong>

                </div>

            </div>

        </section>



        <!-- =================================================
             MESSAGE DE CHARGEMENT / ERREUR
        ================================================== -->

        <div
            id="message"
            class="message"
            role="status"
            aria-live="polite"
        >

            <div class="loading">
                📚 Chargement du catalogue...
            </div>

        </div>



        <!-- =================================================
             CATALOGUE
        ================================================== -->

        <section
            class="catalog-section"
            aria-label="Liste des livres"
        >

            <div
                id="books"
                class="books-grid"
            >

                <!--
                    Les livres seront ajoutés ici
                    par /js/books.js.

                    Le catalogue restera invisible
                    jusqu'à ce que toutes les couvertures
                    soient chargées.
                -->

            </div>

        </section>


    </main>



    <!-- =====================================================
         FOOTER
    ====================================================== -->

    <footer class="site-footer">

        <p>
            © 2026 BiblioSpace —
            Plateforme de gestion de bibliothèque
        </p>

    </footer>



    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script src="/js/books.js"></script>
    <script src="/js/space.js"></script>
    

</body>

</html>
